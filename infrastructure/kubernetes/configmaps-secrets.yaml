---
# ConfigMap for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: viralclip-config
  namespace: viralclip
data:
  api-url: "https://api.viralclip.ai"
  ws-url: "wss://api.viralclip.ai"
  app-env: "production"

---
# Secret template - populate with actual values before deploying
# Use: kubectl create secret generic viralclip-secrets --from-env-file=.env.production -n viralclip
apiVersion: v1
kind: Secret
metadata:
  name: viralclip-secrets
  namespace: viralclip
type: Opaque
stringData:
  database-url: "postgresql://viralclip:CHANGE_ME@postgres:5432/viralclip?sslmode=disable"
  redis-url: "redis://redis-master:6379/0"
  jwt-secret: "CHANGE_ME_32_CHAR_SECRET"
  openai-api-key: "sk-CHANGE_ME"
  postgres-user: "viralclip"
  postgres-password: "CHANGE_ME"
  stripe-secret-key: "sk_live_CHANGE_ME"
  google-client-secret: "CHANGE_ME"

---
# PersistentVolumeClaim for shared storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: viralclip-storage-pvc
  namespace: viralclip
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: viralclip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# HorizontalPodAutoscaler for AI service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: viralclip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
