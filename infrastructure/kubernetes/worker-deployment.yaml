apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: viralclip
  labels:
    app: worker
    app.kubernetes.io/part-of: viralclip-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: viralclip/worker:latest
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: viralclip-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: viralclip-secrets
                  key: redis-url
            - name: AI_SERVICE_URL
              value: "http://ai-service:8000"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: viralclip-storage-pvc
