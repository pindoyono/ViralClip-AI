version: "3.9"

networks:
  viralclip-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  storage-data:

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: viralclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-viralclip}
      POSTGRES_USER: ${DATABASE_USER:-viralclip}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-viralclip_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - viralclip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-viralclip} -d ${DATABASE_NAME:-viralclip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis Cache & Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: viralclip-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - viralclip-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # API Service (Go Fiber)
  # ============================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: viralclip-api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - API_PORT=8080
      - DATABASE_URL=postgresql://${DATABASE_USER:-viralclip}:${DATABASE_PASSWORD:-viralclip_dev_password}@postgres:5432/${DATABASE_NAME:-viralclip}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/app/storage
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - storage-data:/app/storage
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - viralclip-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Worker Service (Go)
  # ============================================================
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
      target: production
    container_name: viralclip-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER:-viralclip}:${DATABASE_PASSWORD:-viralclip_dev_password}@postgres:5432/${DATABASE_NAME:-viralclip}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - AI_SERVICE_URL=http://ai-service:8000
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/app/storage
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - viralclip-net

  # ============================================================
  # AI Service (Python FastAPI)
  # ============================================================
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: viralclip-ai-service
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - AI_SERVICE_PORT=8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - LOCAL_STORAGE_PATH=/app/storage
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - storage-data:/app/storage
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - viralclip-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # Web Frontend (Next.js)
  # ============================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: viralclip-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - viralclip-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: viralclip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
      - ai-service
    networks:
      - viralclip-net
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
